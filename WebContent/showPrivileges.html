        <div id="page-wrapper">
            <div class="row">
                <div class="col-lg-12">
                    <h1 class="page-header">权限管理</h1>
                </div>
                <!-- /.col-lg-12 -->
            </div>
            <!-- /.row -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="panel panel-default">
                        <div class="panel-heading">数据库权限（Privileges）</div>
                        <div class="panel-body">
                            <form action="ShowDatabases" method="get">
                                <div class="row">
                                    <div class="col-lg-3">
                                        <h4><i class="fa fa-database fa-fw"></i> 数据库权限</h4>
                                        <div class="radio">
                                            <label><input name="cbOption" value="dbCreate" type="radio"> 创建（Create）</label>
                                        </div>
                                        <div class="radio">
                                            <label><input name="cbOption" value="dbDrop" type="radio"> 删除（Drop）</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <h4><i class="fa fa-table fa-fw"></i> 表权限</h4>
                                        <div class="radio">
                                            <label><input name="cbOption" value="tbSelect" type="radio"> 查询（Select）</label>
                                        </div>
                                        <div class="radio">
                                            <label><input name="cbOption" value="tbInsert" type="radio"> 插入（Insert）</label>
                                        </div>
                                        <div class="radio">
                                            <label><input name="cbOption" value="tbUpdate" type="radio"> 更新（Update）</label>
                                        </div>
                                        <div class="radio">
                                            <label><input name="cbOption" value="tbDelete" type="radio"> 删除（Delete）</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <h4><i class="fa fa-columns fa-fw"></i> 列权限</h4>
                                        <div class="radio">
                                            <label><input name="cbOption" value="columnSelect" type="radio"> 查询（Select）</label>
                                        </div>
                                        <div class="radio">
                                            <label><input name="cbOption" value="columnInsert" type="radio"> 插入（Insert）</label>
                                        </div>
                                        <div class="radio">
                                            <label><input name="cbOption" value="columnUpdate" type="radio"> 更新（Update）</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <h4><i class="fa fa-cog fa-fw"></i> 存储过程权限</h4>
                                        <div class="radio">
                                            <label><input name="cbOption" value="pcAlter" type="radio"> 修改（Alter）</label>
                                        </div>
                                        <div class="radio">
                                            <label><input name="cbOption" value="pcCreate" type="radio"> 创建（Create）</label>
                                        </div>
                                        <div class="radio">
                                            <label><input name="cbOption" value="pcExecute" type="radio"> 执行（Execute）</label>
                                        </div>
                                    </div>
                                </div>
                                <!-- /.row (nested) -->
                                <hr>
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="radio">
                                            <label><input name="GrantRevoke" value="GrantAll" type="radio" checked> 授予所有权限（Grant All）</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="radio">
                                            <label><input name="GrantRevoke" value="Grant" type="radio"> 授予权限（Grant）</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="radio">
                                            <label><input name="GrantRevoke" value="RevokeAll" type="radio"> 撤销所有权限（Revoke All）</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="radio">
                                            <label><input name="GrantRevoke" value="Revoke" type="radio"> 撤销权限（Revoke）</label>
                                        </div>
                                    </div>
                                </div>
                                <!-- /.row (nested) -->
                                <hr>
                                <button type="submit" class="btn btn-primary"><i class="fa fa-key fa-fw"></i> 提交</button>
                                <button type="reset" class="btn btn-default">重置表单</button>
                            </form>
                        </div>
                        <!-- /.panel-body -->
                    </div>
                    <!-- /.panel -->
                </div>
